name: Build Windows Desktop App

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install cargo-tauri CLI
        shell: pwsh
        run: cargo install tauri-cli --version "^2"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Package backend with PyInstaller
        working-directory: backend
        shell: pwsh
        run: |
          pip install pyinstaller
          pip install -r requirements.txt
          pyinstaller --clean --noconfirm --name focus-task-backend --hidden-import passlib.handlers.bcrypt --add-data "alembic;alembic" --add-data "alembic.ini;." app_server.py
          
      - name: Copy backend to Tauri resources
        shell: pwsh
        run: |
          $releaseDir = "frontend/src-tauri/target/release"
          $backendDest = "$releaseDir/backend"
          New-Item -ItemType Directory -Force -Path $backendDest
          Copy-Item -Path "backend/dist/focus-task-backend/*" -Destination $backendDest -Recurse -Force

      - name: Build Tauri app (NSIS installer)
        working-directory: frontend/src-tauri
        run: cargo tauri build --bundles nsis

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Focus-Task-Windows-x64
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/Focus Task.exe
          if-no-files-found: warn

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
